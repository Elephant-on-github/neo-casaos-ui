name: release CI

on:
  workflow_call:
    secrets:
      NPM_TOKEN:
        required: true
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x]
      # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.0.6
          run_install: false

      - name: "Use Node.js ${{ matrix.node-version }}"
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"
          registry-url: "https://registry.npmjs.org"
        env:
          NPM_TOKEN: ${{secrets.NPM_TOKEN}}

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: "Cache"
        uses: actions/cache@v4
        id: cache-dependencies
        with:
          path: node_modules
          key: ${{runner.OS}}-${{hashFiles('**/pnpm-lock.yaml')}}

      - name: Fetch all tags
        run: sudo git fetch --force --tags

      - name: "Read the current version number"
        id: version
        uses: zhanghengxin/reading-a-file-of-JSON@ice
        with:
          path: ./package.json
          property: version

      - name: Get version
        id: get_version
        run: echo ::set-output name=VERSION::${GITHUB_REF/refs\/tags\//}

      - name: "echo artifact"
        run: |
          echo ${{ steps.version.outputs.value }}
          echo github ${{ github }}
          echo github.sha ${{ github.sha }}
          echo env.VERSION ${{ steps.get_version.outputs.VERSION }}

      - name: Install dependencies
        run: |
          pnpm install
        env:
          NODE_AUTH_TOKEN: ${{secrets.NPM_TOKEN}}

      - run: pnpm build
        env:
          UI_VERSION: ${{ steps.get_version.outputs.VERSION }}
      - run: |
          tar -zcvf linux-all-casaos-${{ steps.get_version.outputs.VERSION }}.tar.gz build

      - name: "Update release"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.get_version.outputs.VERSION }}
          ASSET: ./linux-all-casaos-${{ steps.get_version.outputs.VERSION }}.tar.gz
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET" --clobber
          else
            gh release create "$TAG" "$ASSET" --title "$TAG" --notes "neo-casaos-ui $TAG"
          fi

      - name: Notify neo-casaos manifest bump
        if: success()
        continue-on-error: true
        run: |
          if [ -z "$BUMP_TOKEN" ]; then
            echo "::warning::BUMP_TOKEN secret is not set; skipping manifest bump dispatch."
            exit 0
          fi
          gh api repos/Elephant-on-github/neo-casaos/dispatches \
            -f event_type=released \
            -f 'client_payload[component]=ui' \
            -f "client_payload[tag]=$TAG"
        env:
          GH_TOKEN: ${{ secrets.BUMP_TOKEN }}
          BUMP_TOKEN: ${{ secrets.BUMP_TOKEN }}

